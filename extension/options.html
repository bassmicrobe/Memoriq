<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Memoriq — 設定</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="options.mjs"></script>
</head>
<body class="options">
  <main class="options-card">
    <header>
      <div class="header"><p class="eyebrow">MEMORIQ / SETTINGS</p><a href="popup.html" class="quiet nav-link">タブ整理へ</a></div>
      <h1>休止してよい場所を決める。</h1><p class="muted">使い終わったタブだけを、必要なときに手放します。</p>
    </header>
    <aside class="notice">休止したページは、戻ると再読み込みされます。未保存の入力や会議・画面共有を完全には判別できません。編集・会議・送信・ダウンロードに使うサイトは許可せず、必要に応じて除外してください。</aside>
    <form id="settings-form">
      <fieldset id="fields" disabled>
        <label class="toggle"><input id="automatic" type="checkbox"><span><strong>自動休止を有効にする</strong><small>初期設定はOFF。ONにすると約1分ごとに候補を確認します。</small></span></label>
        <label class="field" for="idle">休止までの未使用時間<span class="input-with-unit"><input id="idle" type="number" min="5" max="1440" step="1" required><span>分</span></span><small>手動と自動の両方に適用。5〜1440分。</small></label>
        <div class="host-columns">
          <label class="field" for="allowed">休止を許可するサイト<textarea id="allowed" rows="7" placeholder="example.com&#10;docs.example.com" spellcheck="false" autocomplete="off"></textarea><small>ホスト名を1行に1つ。URLや * は不可。サブドメインは別々に追加します。</small></label>
          <label class="field" for="excluded">必ず除外するサイト<textarea id="excluded" rows="7" placeholder="meeting.example.com" spellcheck="false" autocomplete="off"></textarea><small>除外が優先されます。ここでの除外は、この拡張による休止だけに適用します。</small></label>
        </div>
        <p class="hint">アクティブ・選択中・固定・音声再生中・読み込み中・自動破棄不可・シークレット・最終アクセス不明のタブは対象外。一度に最大3件を処理します。</p>
        <button id="save" class="primary" type="submit">設定を保存</button>
      </fieldset>
    </form>
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <footer>設定はこのChromeプロファイル内に保存します。外部通信・タブ本文の読み取りは行いません。Macアプリ連携がなくても利用できます。</footer>
  </main>
</body>
</html>
